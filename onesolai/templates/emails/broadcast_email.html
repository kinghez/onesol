<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ subject }}</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background-color: #070919; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; color: #E2E8F0; line-height: 1.6; }
  .wrapper { max-width: 620px; margin: 0 auto; padding: 24px 16px; }
  .card { background: #0F142D; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; overflow: hidden; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); }
  
  /* Header */
  .header { background: linear-gradient(135deg, #131A3E 0%, #0F142D 100%); padding: 36px 32px; text-align: center; border-bottom: 1px solid rgba(91, 99, 246, 0.25); }
  .logo-badge { display: inline-flex; align-items: center; gap: 10px; background: rgba(91, 99, 246, 0.15); border: 1px solid rgba(91, 99, 246, 0.3); padding: 8px 18px; border-radius: 30px; margin-bottom: 16px; }
  .logo-dot { width: 12px; height: 12px; background: #8E6CFF; border-radius: 50%; box-shadow: 0 0 10px #8E6CFF; }
  .logo-title { font-size: 20px; font-weight: 800; color: #FFFFFF; }
  .email-title { font-size: 24px; font-weight: 800; color: #FFFFFF; line-height: 1.3; margin-top: 10px; }

  /* Content */
  .content { padding: 36px 32px; background: #0F142D; color: #CBD5E1; font-size: 15px; }
  .greeting { font-size: 17px; font-weight: 700; color: #F8FAFC; margin-bottom: 16px; }
  .message-body { color: #CBD5E1; white-space: pre-wrap; font-size: 15px; line-height: 1.7; margin-bottom: 32px; }

  /* Primary CTA */
  .cta-wrapper { text-align: center; margin: 32px 0 24px; }
  .cta-btn { display: inline-block; background: linear-gradient(135deg, #5B63F6 0%, #8E6CFF 100%); color: #FFFFFF !important; text-decoration: none; font-size: 15px; font-weight: 700; padding: 14px 32px; border-radius: 12px; box-shadow: 0 8px 24px rgba(91, 99, 246, 0.4); }

  /* Divider */
  .divider { height: 1px; background: rgba(255, 255, 255, 0.08); margin: 32px 0; }

  /* Footer */
  .footer { background: #070919; padding: 28px; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.06); }
  .footer-text { font-size: 12px; color: #64748B; line-height: 1.8; }
  .footer-links { font-size: 12px; margin-bottom: 12px; }
  .footer-links a { color: #8E6CFF; text-decoration: none; margin: 0 8px; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="card">
    
    <!-- Header -->
    <div class="header">
      <div class="logo-badge">
        <div class="logo-dot"></div>
        <span class="logo-title">{{ site_name }}</span>
      </div>
      <h1 class="email-title">{{ subject }}</h1>
    </div>

    <!-- Content -->
    <div class="content">
      <div class="greeting">Hello {{ user_name }}, 👋</div>
      <div class="message-body">{{ message }}</div>

      <div class="cta-wrapper">
        <a href="{{ site_url }}/dashboard/" class="cta-btn">Go to {{ site_name }} →</a>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="footer-links">
        <a href="{{ site_url }}/tools/">AI Tools</a> •
        <a href="{{ site_url }}/refer-and-earn/">Refer & Earn</a> •
        <a href="{{ site_url }}/contact/">Support</a>
      </div>

      <p class="footer-text">
        © {% now "Y" %} {{ site_name }}. All rights reserved.<br>
        Questions? Contact us at <a href="mailto:{{ support_email }}" style="color: #8E6CFF;">{{ support_email }}</a>.
      </p>
    </div>

  </div>
</div>
</body>
</html>

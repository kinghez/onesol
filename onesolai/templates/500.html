<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | OneSol AI Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body {
            background-color: #070919;
            color: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 85% 20%, rgba(239, 68, 68, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 15% 80%, rgba(91, 99, 246, 0.15) 0%, transparent 40%);
        }
        .error-card {
            background: rgba(15, 20, 45, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 36px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .error-code {
            font-size: 86px;
            font-weight: 900;
            background: linear-gradient(135deg, #EF4444, #F59E0B, #8E6CFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 12px;
            letter-spacing: -2px;
        }
        .error-title {
            font-size: 22px;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 12px;
        }
        .error-desc {
            font-size: 15px;
            color: #94A3B8;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #5B63F6, #8E6CFF);
            color: #FFFFFF;
            box-shadow: 0 8px 24px rgba(91, 99, 246, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(91, 99, 246, 0.5);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #CBD5E1;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #FFFFFF;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">500</div>
        <h1 class="error-title">Server Error</h1>
        <p class="error-desc">We encountered an unexpected server error while processing your request. Our technical team has been notified.</p>
        <div class="btn-group">
            <a href="/" class="btn btn-primary"><i class="fa-solid fa-house"></i> Return Home</a>
            <a href="/contact/" class="btn btn-secondary"><i class="fa-solid fa-headset"></i> Contact Support</a>
        </div>
    </div>
</body>
</html>
